<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Notas y asistencia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <main class="contenedor">
        <h1>Ejercicio 1</h1>
        <p>Ingresa tres notas entre 10 y 70 y la asistencia entre 0 y 100 %.</p>
        <form method="post">
            <label for="nota1">Nota 1</label>
            <input id="nota1" name="nota1" type="number" min="10" max="70" step="any" value="{{ request.form.get('nota1', '') }}" required>
            <label for="nota2">Nota 2</label>
            <input id="nota2" name="nota2" type="number" min="10" max="70" step="any" value="{{ request.form.get('nota2', '') }}" required>
            <label for="nota3">Nota 3</label>
            <input id="nota3" name="nota3" type="number" min="10" max="70" step="any" value="{{ request.form.get('nota3', '') }}" required>
            <label for="asistencia">Asistencia (%)</label>
            <input id="asistencia" name="asistencia" type="number" min="0" max="100" step="any" value="{{ request.form.get('asistencia', '') }}" required>
            <button type="submit">Calcular resultado</button>
        </form>
        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        {% if estado %}
            <section class="resultado" aria-live="polite">
                <h2>Resultado</h2>
                <p>Promedio: {{ '%.2f'|format(promedio) }}</p>
                <p>Estado: <strong>{{ estado }}</strong></p>
            </section>
        {% endif %}
        <a class="volver" href="{{ url_for('inicio') }}">Volver al inicio</a>
    </main>
</body>
</html>
